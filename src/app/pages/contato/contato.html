<form
  action=""
  class="flex flex-col gap-2 bg-gray-200 p-4 rounded-lg justify-center max-w-[500px] mx-auto mt-10 [&_input]:bg-white [&_input]:p-2 [&_input]:rounded-lg [&_button]:bg-blue-500 [&_button]:p-2 [&_button]:rounded-lg [&_button]:hover:bg-blue-600"
>
  <label for="contact-name">Name</label>
  <input type="text" id="contact-name" placeholder="name" [formField]="contatoForm.name" />
  <label for="contact-email">Email</label>
  <input type="email" id="contact-email" placeholder="email" [formField]="contatoForm.email" />
  <label for="contact-message">Message</label>
  <input type="text" id="contact-message" placeholder="message" [formField]="contatoForm.message" />
  <button type="button" (click)="sendForm()">Send</button>
</form>
