<div class="flex items-center justify-center flex-col">
  <h1 class="text-2xl font-bold text-center">Login</h1>
  <form
    action=""
    class="flex flex-col gap-2 bg-gray-200 p-4 rounded-lg justify-center max-w-[500px] mx-auto mt-10 [&_input]:bg-white [&_input]:p-2 [&_input]:rounded-lg [&_button]:bg-blue-500 [&_button]:p-2 [&_button]:rounded-lg [&_button]:hover:bg-blue-600"
  >
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="email" [formField]="loginForm.email" />
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="password" [formField]="loginForm.password" />
    <button type="button" (click)="postLogin()">Send</button>
  </form>
</div>
