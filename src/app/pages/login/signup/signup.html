<h1>Sign up</h1>
<p>Faça o seu cadastro</p>
<form
  action=""
  class="flex flex-col gap-2 bg-gray-200 p-4 rounded-lg justify-center max-w-[500px] mx-auto mt-10 [&_input]:bg-white [&_input]:p-2 [&_input]:rounded-lg [&_button]:bg-blue-500 [&_button]:p-2 [&_button]:rounded-lg [&_button]:hover:bg-blue-600"
>
  <label for="signup-username">Username</label>
  <input type="text" id="signup-username" placeholder="username" [formField]="signupForm.username" />
  <label for="signup-email">Email</label>
  <input type="email" id="signup-email" placeholder="email" [formField]="signupForm.email" />
  <label for="signup-password">Password</label>
  <input type="password" id="signup-password" placeholder="password" [formField]="signupForm.password" />
  <button type="button" (click)="postSignup()">Send</button>
</form>
