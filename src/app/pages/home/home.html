<h1>home works!</h1>
<h2>{{ store.products() | json }}</h2>
<div class="flex flex-row gap-4">
  @for (product of store.products(); track product.id) {
    <app-product [product]="product" (addToCartOutput)="addProductToCart($event)"></app-product>
  }
  <p>Total:</p>
  <app-cart [cart]="store.cart()"></app-cart>
</div>
<app-user-profile></app-user-profile>
