<div class="flex mb-10 max-w-[280px] bg-gray-200 p-4 rounded-lg shadow-md flex-col">
  <img src="http://www.lorempixel.com.br/120/80" alt="Nature" />
  <h1>{{ product().title }}</h1>
  <p>{{ product().description }}</p>
  <label for="quantity">Digite um número</label>
  <input
    class="bg-white border border-gray-300 rounded px-2 py-1 mb-2"
    type="number"
    id="quantity"
    placeholder="Digite um número"
    max="100"
    min="0"
    [value]="product().quantity"
    (input)="product().quantity = $any($event.target).value"
  />
  <label for="Valor">Valor: {{ product().price }}</label>
  <h3>Total: {{ product().quantity * product().price }}</h3>
  <button
    class="bg-blue-500 hover:cursor-pointer px-4 py-2 rounded disabled:opacity-50 disabled:cursor-not-allowed"
    (click)="addToCart()"
    [disabled]="product().quantity <= 0 || alreadyOnCart(product().id)"
  >
    ADD TO CART
  </button>
</div>
