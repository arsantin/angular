<div
  class="flex flex-col items-center justify-center bg-red-300 p-4 rounded-lg shadow-md text-antiquewhite"
>
  <ul>
    @for (product of cart(); track $index) {
      <li>
        <div class="flex items-center justify-between">
          <div class="flex flex-col items-center">
            <img src="http://www.lorempixel.com.br/120/80" alt="Nature" class="mr-2 rounded" />
            <div>
              <h4>SKU{{ product.id }} - {{ product.title }}</h4>
              <p>Preço: {{ product.price }}</p>
              <label for="quantity-{{ product.id }}">Quantidade:</label>
              <input
                class="bg-white border border-gray-300 rounded px-2 py-1 mb-2"
                type="number"
                [id]="'quantity-' + product.id"
                placeholder="Digite um número"
                max="100"
                min="0"
                [value]="product.quantity"
                (input)="product.quantity = $any($event.target).value"
              />
            </div>
          </div>
          <button
            (click)="removeFromCart(product.id)"
            class="ml-2 bg-red-500 hover:bg-red-700 text-white px-2 py-1 rounded"
          >
            Remover
          </button>
        </div>
      </li>
    }
  </ul>
  <p>Total: {{ totalPrice() }}</p>
  @if (totalPrice() > 0) {
    <button
      (click)="addOrder({ orders: cart(), total: totalPrice() })"
      class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded"
    >
      Finalizar Compra
    </button>
  }
</div>
